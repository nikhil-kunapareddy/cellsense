[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cellsense"
version = "0.2.0"
description = "An agent harness for spreadsheets — ask natural-language questions about CSV and Excel files from your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sai Nikhil Kunapareddy" }]
keywords = ["llm", "agent", "langgraph", "pandas", "excel", "csv", "cli", "data-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

# Kept deliberately light: the harness, the data substrate, and the terminal.
# Model integrations are optional extras so `pip install cellsense` stays small
# and a missing provider fails loudly for that provider only.
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "rich>=13.7",
    "prompt_toolkit>=3.0.48",
    "typer>=0.15",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai    = ["langchain-openai>=1.0"]
gemini    = ["langchain-google-genai>=4.0"]
groq      = ["langchain-groq>=1.0"]
llama     = ["langchain-openai>=1.0"]
all = [
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-groq>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs",
    "types-openpyxl",
]

[project.scripts]
cellsense = "cellsense.cli:main"

[project.urls]
Homepage = "https://github.com/nikhilkunapareddy/cellsense"
Issues = "https://github.com/nikhilkunapareddy/cellsense/issues"

[tool.hatch.build.targets.wheel]
packages = ["cellsense"]

# ── Lint ───────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["output", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return
    "PTH",       # use pathlib
    "RUF",
]
ignore = [
    "B008",    # typer uses function calls in argument defaults by design
    "RUF012",  # mutable class attrs without ClassVar — noisy for dataclass-ish config
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cellsense"]

# ── Types ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
files = ["cellsense"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = [
    "langgraph.*", "langchain_core.*", "langchain_anthropic.*", "langchain_openai.*",
    "langchain_google_genai.*", "langchain_groq.*", "matplotlib.*", "prompt_toolkit.*",
]
ignore_missing_imports = true

# ── Tests ──────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: hits a real model API; requires provider keys and network (deselect with '-m \"not live\"')",
    "slow: takes more than a couple of seconds",
]
filterwarnings = [
    "error::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["cellsense"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
